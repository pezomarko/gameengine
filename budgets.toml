# Every number CI enforces. Read by gm-tools (budget check) and scripts/*.sh.
# Sources: PLAN.md 2.6 (assets), 11.8 (phase gates).

[character]
max_triangles = 3500        # PLAN 2.6: 2,500-3,500 tris. The floor is an art guideline, not a gate.
max_bones = 32
max_texture_size = 1024     # per axis
max_textures = 1            # one atlas, one draw call
max_payload_bytes = 1572864 # 1.5 MiB ceiling for the whole .glb

[avatars]
# MODELS.md 11, PLAN.md 11.8 Phase 6: distinct avatars at the [character] ceiling in the town
# (scripts/check-avatars.sh). The cache cap of the gate is smaller than the models on purpose:
# the run has to evict, and the directory may never be larger than the cap.
count = 100
cache_cap_mb = 32               # 100 ceiling avatars are 38.2 MB
min_fps = 60                    # on the reference iGPU (--gate-fps)
max_frame_ms_p99 = 16           # no visible hitch: 99 frames in 100 inside one 60 Hz period
max_gpu_bytes_per_model = 1048576   # vertices + indices + the BC1 mip chain; measured 779,628
max_town_bytes_per_player_s = 8192  # zone -> client with 100 players in view at 20 Hz (--online)
smoke_count = 48                # --software (CI): enough models to overflow the smallest cap
smoke_cache_cap_mb = 16

[map]
max_bsp_bytes = 33554432    # 32 MiB per zone map (generous; tighten when real maps exist)
max_lightmap_bytes = 16777216

[client]
max_binary_bytes = 10485760     # 10 MiB absolute (Phase 1 acceptance)
max_regression_bytes = 1048576  # 1 MiB over ci/baselines/gm-client-size fails
max_rss_bytes = 209715200       # 200 MiB (Phase 1 acceptance); product ceiling is 500 MiB
min_fps = 60                    # on the reference iGPU; only checked on a self-hosted runner

[net]
# PROTOCOL.md 9: UDP bytes per player per second in each direction, 16 players, 64 Hz.
max_bytes_per_player_s = 30720
# Acceptance test network: round trip and independent datagram loss per direction.
test_rtt_ms = 150
test_loss = 0.03

[server]
# HUB.md 5: one zone with 200 duelist bots in the arena hall on the reference machine (the bots
# run on the same machine). Half the 15.6 ms period for the mean, three quarters for the p99.
max_tick_mean_us = 8000
max_tick_p99_us = 12000
max_rss_bytes = 536870912   # 512 MiB with 200 players

[companions]
# COMPANIONS.md 14, PLAN.md 11.8 Phase 7 (scripts/check-dungeon.sh): the tutorial dungeon with
# `leaders` raid leaders and their squads of three in one zone, bots on the same machine.
leaders = 16
max_mind_us = 25            # mean microseconds per mind per tick; measured 3.9-6.5
max_nav_build_ms = 500      # flooding the map at zone start; measured 6 (dungeon), 14 (arena)
max_tick_p99_us = 4000      # 16 humans + 48 companions + 3 creatures; measured 1,830-2,360
min_clear_s = 45            # the Warden, engaged to dead, for the reference squad
max_clear_s = 300           # (also the trial's limit)
max_bytes_per_player_s = 30720  # as [net]; measured 17,900 mean with 67 bodies in the dungeon

[hub]
# HUB.md 5: the hub's share of login -> zone -> handoff -> logout on loopback, milliseconds.
round_trip_ms = 2000

[web]
# WEB.md 9 (scripts/check-web.sh): the browser client. Two builds, because the cost is not
# symmetric: on WebGPU wgpu is a thin binding, for WebGL2 it links its GLES backend and the
# shader translator. Sizes are of the .wasm after wasm-opt; "packed" is brotli -q 11 (what a
# static host serves), gzip -9 where brotli is not installed.
max_webgpu_wasm_bytes = 2097152         # raised from 1 MiB by the director on 2026-10-03 (WEB.md 9); measured 1,249,355 with the fingers (2026-10-08), 1,009,465 after Phase 13 (977,242 in Phase 12, 1,005,086 in Phase 11, 967,052 in Phase 10)
max_webgpu_packed_bytes = 786432        # raised with it; measured 421,092 with the fingers (2026-10-08), 345,287 after Phase 13
max_webgl_wasm_bytes = 3407872          # measured 3,240,891 (2026-10-08), 3,003,328 after Phase 13
max_webgl_packed_bytes = 1048576        # measured 991,920 (2026-10-08), 918,847 after Phase 13
max_js_bytes = 180224                   # wasm-bindgen glue + loader + page, per build; measured 170,358 (webgl)
max_wasm_memory_bytes = 67108864        # linear memory in the 8v8 arena; measured 3.3 MiB
min_snapshots_per_s = 55                # of the zone's 64, as the browser client counts them
min_fps = 55                            # headless Chromium presents at 60 on the reference iGPU
max_first_frame_ms = 3000               # navigation to the first frame on loopback

[anticheat]
# ANTICHEAT.md 10 (scripts/check-anticheat.sh): the arena with `honest` bots whose view moves
# like a hand and `cheats` that aim by program (half lock, half flick), recorded.
honest = 12
cheats = 4
secs = 90
max_record_us = 150                 # recorder + sight + aim analysis, mean per tick, 16 players; measured 55-69 (200 players: 592-626)
max_replay_bytes_per_minute = 1572864   # a 16-player fight's .gmr; measured 0.29-0.33 MB
max_ring_bytes = 67108864           # the 30 s the recorder always holds; measured 0.32-0.38 MB with 16 players

[screens]
# CLIENT.md 10 (scripts/check-screens.sh): the client's screens, by UI script and by real
# input, on the software GPU of a display of its own. The times are bounds on a run that
# works, generous because that GPU is slow and CI machines differ: a screen that wedges
# never gets there at all.
rounds = 20                           # of Play and Leave, one after the other
max_secs_to_town = 20                 # from the program's start: account, character, entry; measured 0.5-0.6 (2.6 on a loaded machine)
max_round_ms = 3000                   # one Play and one Leave, mean; measured 121-154 (577 loaded)
max_rounds_rss_growth_bytes = 16777216   # what the rounds may leave behind in the client; measured 2.9 MB for 20, 60 and 150
max_rounds_threads_added = 2          # a connection's thread that outlived its connection would add one a round

[items]
# ITEMS.md 7 (scripts/check-items.sh): a stall bought from and a sword worn through the
# client's screens, on the software GPU of a display of its own. A bound on a run that
# works: a screen that wedges never gets there at all.
max_secs_stall_to_worn = 20           # from E at the stall to the sword being worn, by script; measured 0.5-0.6

# People together (docs/PARTY.md 9; scripts/check-party.sh).
[party]
max_secs_dungeon_together = 420       # two bots as people, each with three recruits, the gate and the Warden; measured 149-165
max_secs_party_to_traded = 60         # from being in a party to the trade being done, by script (two chat lines and a 3 s lock are in it); measured 6.2-6.3

# Sound (docs/SOUND.md 8; scripts/check-sound.sh): synthesized at start, mixed by the client
# natively and by the browser in the browser; proved by rendering a run into a WAV.
[sound]
# What the phase added, for the record: the budgets were 40,960 for the wasm (of the 71,334 then
# left) and 307,200 for the native client (cpal with ALSA, and the mixer). Not gated since
# 2026-10-08: later phases grew both past those sums, and the totals are the size gates' to
# hold ([binary], [web]). check-sound.sh prints the growth since Phase 12 as a note.
wasm_added_bytes = 32223              # measured when the phase landed
webgpu_wasm_bytes_before = 977242     # the WebGPU wasm before the phase (Phase 12)
native_added_bytes = 128560           # measured when the phase landed (the client built alone, as the baseline is)
native_bytes_before = 9483040         # the native client before the phase (ci/baselines/gm-client-size of Phase 12)
max_patch_bytes = 2097152             # the rendered patches in memory; measured 1,228,060 (rendered in 32 ms, release)
max_block_us = 200                    # microseconds per 512-frame stereo block with 32 voices, release; measured 92 in the bench, 40-91 in the client's dump, 25-39 on the device
min_walk_steps = 20                   # steps heard in five seconds of running (a stride is 64 units at ~300 units/s); measured 25
min_quiet_db = 60                     # a standing body: the loudest 100 ms window at least this far under full scale; measured digital silence
max_steps_db = 35                     # running, and the fight: the loudest 100 ms window no further under full scale than this; measured 27 for steps, 8-19 in the fight

# The content bundle (docs/CONTENT.md 4 and 5, docs/LOOK.md 8; scripts/check-look.sh): what
# `gm-tools content build` writes to assets/built/content and a browser may have to fetch.
[content]
max_bundle_bytes = 2097152            # the whole directory; measured 713,302 (6 props, four atlases, the manifest)
max_atlas_bytes = 393216              # one atlas (a client fetches ui.gma and the one of its scale); measured 49,641 / 123,997 / 200,633 / 282,595 at 1 to 4 texels a dot
max_prop_gmm_bytes = 131072           # one prop, CONTENT.md 4; measured 2,240-15,830
max_prop_triangles = 1000             # CONTENT.md 4 (gm-model's limits::PROP_MAX_TRIANGLES)
max_prop_texture = 256                # per axis

# The look (docs/LOOK.md 8; scripts/check-look.sh): props in hands and the skin's screens.
[look]
max_prop_draw_ms = 0.5                # a frame's cost of 48 held props over the same crowd bare, offline
min_fps = 60                          # the armed crowd on the reference iGPU (--gate-fps)
max_page_ms = 0.8                     # the inventory with its paperdoll, a frame on the iGPU
max_hud_ms = 0.15                     # the hotbar, statuses, portrait and party frames, a frame on the iGPU
